<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Junco | Arquitectura y Diseño</title>
    <style>
        :root { --bg: #0a0a0a; --text: #f0f0f0; --accent: #d4af37; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        header { padding: 50px 20px 30px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 5px; letter-spacing: 2px; text-transform: uppercase; }
        p.subtitle { color: #a0a0a0; font-size: 1.1rem; margin-bottom: 40px; }
        .hero-img { width: 100%; max-width: 900px; height: auto; border-radius: 4px; margin: 0 auto; display: block; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; padding: 20px; max-width: 900px; margin: 0 auto; }
        .gallery img { width: 100%; height: auto; border-radius: 4px; transition: transform 0.3s ease; }
        .gallery img:hover { transform: scale(1.02); }
        .cta-container { text-align: center; padding: 60px 20px; }
        .cta-btn { background: var(--accent); color: #000; padding: 18px 35px; text-decoration: none; font-weight: bold; font-size: 1.1rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <header>
        <h1>Casa Junco</h1>
        <p class="subtitle">Concepto Espacial y Materialidad</p>
        <img src="public/images/imagen_1.webp" alt="Vista Principal Casa Junco" class="hero-img">
    </header>

    <section class="gallery">
        <img src="public/images/imagen_2.webp" alt="Detalle Casa Junco 1" loading="lazy">
        <img src="public/images/imagen_3.webp" alt="Detalle Casa Junco 2" loading="lazy">
        <img src="public/images/imagen_4.webp" alt="Detalle Casa Junco 3" loading="lazy">
    </section>

    <div class="cta-container">
        <a href="https://wa.me/5492255435356?text=Hola,%20quiero%20acceder%20al%20dossier%20privado%20de%20Casa%20Junco" class="cta-btn">Solicitar Dossier por WhatsApp</a>
    </div>
</body>
</html>
